name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Garde de version (modele ERP/RH 878acef) : grave l'identite du deploiement.
      # - public/version.json : build (run_number) + commit court + date UTC + apiContractMin
      #   (LU depuis api/contrat-api.json du MEME commit -> le contrat que CE web exige).
      # - api/version.json : meme build/commit/date, servi par GET /api/version.
      # Une seule source de contrat (api/contrat-api.json), un seul endroit a bumper.
      - name: Graver l'identite de version (public/version.json + api/version.json)
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            let contrat = {}; try { contrat = JSON.parse(fs.readFileSync("api/contrat-api.json", "utf8")); } catch (e) {}
            const apiContractMin = (Number.isInteger(contrat.version) && contrat.version > 0) ? contrat.version : null;
            const build = process.env.GITHUB_RUN_NUMBER || null;
            const commit = (process.env.GITHUB_SHA || "").slice(0, 7) || null;
            const buildDate = new Date().toISOString();
            fs.writeFileSync("public/version.json", JSON.stringify({ app: "mp-neurones-front", build, commit, buildDate, apiContractMin }));
            fs.writeFileSync("api/version.json", JSON.stringify({ app: "mp-neurones-api", build, commit, buildDate }));
            console.log("public/version.json ->", fs.readFileSync("public/version.json", "utf8"));
            console.log("api/version.json ->", fs.readFileSync("api/version.json", "utf8"));
          '
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_PLANT_062AFBC10 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/public" # App source code path
          api_location: "/api" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_PLANT_062AFBC10 }}
          action: "close"
